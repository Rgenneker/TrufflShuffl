kind = "web"
previewPath = "/"
title = "TrufflShuffl Calculators"
version = "1.0.0"
id = "artifacts/trufflshuffl-calculators"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25162

[services.development]
run = "pnpm --filter @workspace/trufflshuffl-calculators run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trufflshuffl-calculators", "run", "build" ]
publicDir = "artifacts/trufflshuffl-calculators/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25162"
BASE_PATH = "/"
